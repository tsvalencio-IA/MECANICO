<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>thIAguinho • Atualizando</title>
<style>
html,body{margin:0;min-height:100%;background:#07111f;color:#edf5ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center}
.box{max-width:420px}.spin{width:46px;height:46px;margin:0 auto 18px;border:4px solid #173a5a;border-top-color:#31d7ff;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}h1{font-size:1.35rem;margin:0 0 8px}p{color:#9fb0c3;margin:0}
</style>
</head>
<body><main><div class="box"><div class="spin"></div><h1>Atualizando thIAguinho</h1><p>Abrindo a versão 1.3.4…</p></div></main>
<script>
(async function(){
  const target="./app-v134.html?v=1.3.4&fresh="+Date.now();
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if("caches" in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
  location.replace(target);
})();
</script>
</body></html>
