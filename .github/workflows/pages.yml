name: Deploy thIAguinho Soluções Automotiva

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate JavaScript
        run: node --check js/app.js && node --check js/firebase.js && node --check js/media.js && node --check data/knowledge.js
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
      - name: Verify critical assets
        run: test -f index.html && test -f css/app.css && test -f js/firebase.js && test -f js/media.js && test -f database.rules.json && test -f assets/icon.svg && test -f assets/logo-thIAguinho.webp && test -f assets/mascote-thIAguinho.webp
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
