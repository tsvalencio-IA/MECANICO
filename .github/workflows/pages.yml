name: Validate and deploy thIAguinho

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript
        run: |
          node --check js/app.js
          node --check js/firebase.js
          node --check js/media.js
          node --check data/knowledge.js
          node --check sw.js

      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"

      - name: Verify critical files and privacy architecture
        run: |
          test -f index.html
          test -f css/app.css
          test -f assets/logo-thIAguinho.svg
          test -f assets/icon-thIAguinho.svg
          test -f assets/mascote-thIAguinho.webp
          test -f database.rules.json
          grep -q "signInAnonymously" js/firebase.js
          grep -q "mecanico-b222e-default-rtdb" js/firebase.js
          grep -q "Fotos e vídeos são analisados temporariamente" index.html
          ! grep -q "AUTODATA 3.45.rar" index.html
          ! grep -q "SIMPLO-2019.rar" index.html
          ! grep -q "CONHECIMENTO.ZIP" index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
