name: Validate thIAguinho

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript
        run: |
          node --check js/app.js
          node --check js/firebase.js
          node --check js/media.js
          node --check js/knowledge-remote.js
          node --check data/knowledge.js
          node --check sw.js
          node --check sw-v132.js
          node --check sw-v133.js
          node --check sw-v134.js

      - name: Validate manifest
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest-v134.json','utf8'));
          if(m.id!=='/MECANICO/app-v134.html'||m.scope!=='/MECANICO/'||!m.start_url.startsWith('/MECANICO/app-v134.html')) throw new Error('manifest scope/start/id');
          if(!m.icons.some(i=>i.type==='image/png'&&i.sizes==='192x192')) throw new Error('192 PNG icon missing');
          if(!m.icons.some(i=>i.type==='image/png'&&i.sizes==='512x512')) throw new Error('512 PNG icon missing');
          console.log('manifest v1.6.2 installable fields ok');
          NODE

      - name: Verify PWA, media, diagnosis and knowledge retrieval
        run: node --test scripts/test_*.cjs

      - name: Verify compact knowledge builder
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Knowledge smoke checks
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{}};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('data/knowledge.js','utf8'),ctx);
          const kb=ctx.window.ORACLE_KNOWLEDGE;
          if(!kb||kb.version!=='1.0.0') throw new Error('knowledge version');
          if(!kb.dtcs.DF1355||!kb.dtcs.DF026) throw new Error('V42 DTC catalog incomplete');
          if(!kb.parameters.PR037||!kb.parameters.PR1153) throw new Error('V42 parameter catalog incomplete');
          if(!(kb.facts||[]).some(x=>x.id==='k4m-injector-resistance')) throw new Error('K4M injector fact missing');
          if((kb.rules||[]).length<10) throw new Error('diagnostic rules unexpectedly small');
          console.log('knowledge ok',Object.keys(kb.dtcs).length,'DTC entries',Object.keys(kb.parameters).length,'parameters',kb.rules.length,'rules');
          NODE

      - name: Verify critical files and privacy architecture
        run: |
          test -f index.html
          test -f app-v134.html
          test -f manifest-v134.json
          test -f sw-v134.js
          test -f css/app.css
          test -f js/knowledge-remote.js
          test -f assets/logo-thIAguinho.svg
          test -f assets/icon-thIAguinho.svg
          test -f assets/icon-192.png
          test -f assets/icon-512.png
          test -f assets/mascote-thIAguinho.webp && test -f assets/mascote-thIAguinho-hero.webp && test -f assets/mascote-thIAguinho-avatar.webp && test -f assets/mascote-thIAguinho-hero.png && test -f assets/mascote-thIAguinho-avatar.png
          test -f database.rules.json
          grep -q "signInAnonymously" js/firebase.js
          grep -q "mecanico-b222e-default-rtdb" js/firebase.js
          grep -q 'const MIGRATION_VERSION="1.6.2"' sw.js
          grep -q 'const MIGRATION_VERSION="1.6.2"' sw-v132.js
          grep -q 'const MIGRATION_VERSION="1.6.2"' sw-v133.js
          grep -q "Fotos e vídeos são analisados localmente" app-v134.html
          grep -q "A IA externa só recebe textos após sua autorização" app-v134.html
          grep -q "js/ai-remote.js" app-v134.html
          grep -q "avatarCriticalStyle" app-v134.html
          grep -q "manifest-v134.json" app-v134.html
          grep -q 'id="installDialog"' app-v134.html
          grep -q 'id="installBtn"' app-v134.html
          grep -q 'BUILD="1.6.2"' js/app.js
          grep -q "js/knowledge-remote.js" app-v134.html
          grep -q "knowledge-compact" js/knowledge-remote.js
          ! grep -q "DecompressionStream" js/knowledge-remote.js
          grep -q "minimal install service worker v1.6.2" sw-v134.js
          grep -q "data:image/webp;base64" css/app.css
          ! grep -q "AUTODATA 3.45.rar" app-v134.html
          ! grep -q "SIMPLO-2019.rar" app-v134.html
          ! grep -q "CONHECIMENTO.ZIP" app-v134.html

